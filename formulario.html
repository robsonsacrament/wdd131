<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Avaliação - Robson Sacramento Beserra</title>
    <meta name="description" content="Formulário de avaliação de produto - WDD 131">
    <meta name="author" content="Robson Sacramento Beserra">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="estilos/formulario.css">
    <script src="scripts/formulario.js" defer></script>
</head>
<body>

    <header>
        <h1>Avaliação do Produto</h1>
    </header>

    <main>
        <form action="avaliacao.html" method="get" id="form-avaliacao">

            <!-- Nome do Produto -->
            <div class="form-group">
                <label for="produto">Nome do Produto <span class="required">*</span></label>
                <select id="produto" name="produto" required>
                    <option value="" disabled selected>Escolha um Produto...</option>
                </select>
            </div>

            <!-- Classificação Geral (estrelas) -->
            <div class="form-group">
                <label class="rating-label">Classificação Geral <span class="required">*</span></label>
                <div class="rating">
                    <input type="radio" id="star1" name="rating" value="1" required>
                    <label for="star1" title="1 estrela">☆</label>
                    <input type="radio" id="star2" name="rating" value="2">
                    <label for="star2" title="2 estrelas">☆</label>
                    <input type="radio" id="star3" name="rating" value="3">
                    <label for="star3" title="3 estrelas">☆</label>
                    <input type="radio" id="star4" name="rating" value="4">
                    <label for="star4" title="4 estrelas">☆</label>
                    <input type="radio" id="star5" name="rating" value="5">
                    <label for="star5" title="5 estrelas">☆</label>
                </div>
                <small class="rating-hint">Clique nas estrelas para avaliar</small>
            </div>

            <!-- Data de Instalação -->
            <div class="form-group">
                <label for="data-instalacao">Data de Instalação <span class="required">*</span></label>
                <input type="date" id="data-instalacao" name="data-instalacao" required>
            </div>

            <!-- Recursos Úteis (checkbox) -->
            <div class="form-group">
                <label>Quais recursos você achou úteis? <small>(Marque todos que se aplicam)</small></label>
                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="recursos" value="Manual"> Manual
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="recursos" value="Suporte"> Suporte
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="recursos" value="Videos"> Vídeos
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="recursos" value="Comunidade"> Comunidade
                    </label>
                </div>
            </div>

            <!-- Avaliação Escrita -->
            <div class="form-group">
                <label for="avaliacao-escrita">Avaliação Escrita <small>(Opcional)</small></label>
                <textarea id="avaliacao-escrita" name="avaliacao-escrita" rows="4" placeholder="Conte-nos mais sobre sua experiência com o produto..."></textarea>
            </div>

            <!-- Nome de Usuário -->
            <div class="form-group">
                <label for="nome-usuario">Seu Nome <small>(Opcional)</small></label>
                <input type="text" id="nome-usuario" name="nome-usuario" placeholder="Digite seu nome">
            </div>

            <!-- Botão Enviar -->
            <div class="form-group">
                <input type="submit" value="📨 Publicar Avaliação" class="btn-submit">
            </div>

        </form>
    </main>

    <footer>
        <p>&copy; <span id="anoatual"></span> Robson Sacramento Beserra</p>
        <p id="ultimaModificacao"></p>
    </footer>

</body>
</html>
